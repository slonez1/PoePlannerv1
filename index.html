<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poe's Menu Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        @keyframes float-breathing {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }
        .animate-mascot {
            animation: float-breathing 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media print {
            nav, header, .no-print, button, .sidebar-sync, .mascot-hero, .filters, .recipe-grid, .rotation-list-item, main > div > * {
                display: none !important;
            }
            body { 
                background-color: white !important; 
                padding: 0 !important; 
                margin: 0 !important;
                color: black !important;
                overflow: visible !important;
            }
            #root { margin: 0; padding: 0; display: block !important; }
            main { padding: 0 !important; margin: 0 !important; overflow: visible !important; height: auto !important; display: block !important; }
            .printable-shopping-list {
                display: block !important;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                margin: 0;
                padding: 20px;
                border: none !important;
                box-shadow: none !important;
            }
            .printable-recipe-details {
                display: block !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: auto !important;
                z-index: 9999 !important;
                background: white !important;
                color: black !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
            }
            .printable-recipe-details * {
                visibility: visible !important;
                color: black !important;
                text-shadow: none !important;
                box-shadow: none !important;
            }
            .printable-recipe-details .modal-close-btn, 
            .printable-recipe-details .modal-actions,
            .printable-recipe-details input,
            .printable-recipe-details textarea {
               display: none !important; 
            }
        }
    </style>
    <script>
      window.process = window.process || { env: {} };
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1?dev",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime?dev",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?dev&deps=react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1?dev&deps=react@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?dev&deps=react@18.3.1",
    "@google/genai": "https://esm.sh/@google/genai",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
